name: Release Obsidian plugin

# Run it from the Actions tab ("Run workflow"), or push a tag that matches
# manifest.json's version (e.g. 1.0.1). It builds the plugin, attests the build,
# and publishes a release named after the manifest version with main.js,
# manifest.json and styles.css. Release notes come from CHANGELOG.md.
on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Work out the version
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$VERSION"
          awk -v v="$tag" '
            /^## / { on = ($2 == v) ; next }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $tag" > notes.md
          gh release create "$tag" \
            --target="$GITHUB_SHA" \
            --title="$tag" \
            --notes-file notes.md \
            main.js manifest.json styles.css
